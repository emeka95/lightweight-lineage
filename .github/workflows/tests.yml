name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        python-version:
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Smoke test installed CLI outputs
        run: |
          lineage --help
          lineage gui --help
          python -c "import tkinter; import lightweight_lineage.gui"
          lineage scan fixtures/fix1/repo
          lineage scan fixtures/fix1/repo --format html
          lineage scan fixtures/fix2/repo --dialect redshift
          python -c "import json; from pathlib import Path; outputs=Path('fixtures/fix1/outputs'); assert json.loads((outputs/'lineage.json').read_text(encoding='utf-8'))['objects']; assert (outputs/'lineage.html').read_text(encoding='utf-8').startswith('<!doctype html>')"
