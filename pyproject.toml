[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-lineage"
version = "0.1.0"
description = "Offline repository scanning and data lineage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "jinja2>=3.1,<4",
    "sqlfluff>=4.5,<5",
]

[project.scripts]
lineage = "lightweight_lineage.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

